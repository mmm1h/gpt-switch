<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPT Switch</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f7f8fb;
        color: #1e2532;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #10131a;
          color: #edf0f5;
        }
      }

      body {
        width: 360px;
        min-height: 420px;
        margin: 0;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .app {
        padding: 16px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .title {
        margin: 0;
        font-size: 17px;
        font-weight: 760;
      }

      .icon-btn {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        color: #176b5b;
        background: rgba(23, 107, 91, 0.1);
        font-size: 17px;
        font-weight: 760;
      }

      .subtle {
        color: #667085;
        font-size: 12px;
        line-height: 1.45;
      }

      @media (prefers-color-scheme: dark) {
        .subtle {
          color: #a5adbb;
        }
      }

      .panel {
        display: grid;
        gap: 10px;
      }

      .box {
        border: 1px solid rgba(102, 112, 133, 0.22);
        border-radius: 8px;
        padding: 12px;
        background: rgba(255, 255, 255, 0.72);
      }

      @media (prefers-color-scheme: dark) {
        .box {
          background: rgba(255, 255, 255, 0.05);
        }
      }

      .field {
        display: grid;
        gap: 5px;
        margin-bottom: 9px;
      }

      .field label {
        font-size: 12px;
        color: #596273;
      }

      @media (prefers-color-scheme: dark) {
        .field label {
          color: #b5bdca;
        }
      }

      .input,
      .select {
        box-sizing: border-box;
        width: 100%;
        min-height: 36px;
        border: 1px solid rgba(102, 112, 133, 0.32);
        border-radius: 6px;
        padding: 7px 9px;
        background: rgba(255, 255, 255, 0.9);
        color: inherit;
      }

      @media (prefers-color-scheme: dark) {
        .input,
        .select {
          background: rgba(255, 255, 255, 0.07);
        }
      }

      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .row > * {
        flex: 1;
      }

      .btn {
        min-height: 36px;
        border-radius: 6px;
        padding: 7px 10px;
        color: #fff;
        background: #176b5b;
        font-weight: 680;
      }

      .btn.secondary {
        color: #263041;
        background: #e8ecf3;
      }

      .btn.danger {
        background: #bd3b3b;
      }

      .btn.ghost {
        color: inherit;
        background: transparent;
        border: 1px solid rgba(102, 112, 133, 0.28);
      }

      @media (prefers-color-scheme: dark) {
        .btn.secondary {
          color: #e9edf4;
          background: rgba(255, 255, 255, 0.11);
        }
      }

      .profile {
        display: grid;
        grid-template-columns: 12px 1fr;
        gap: 10px;
        padding: 10px 0;
        border-top: 1px solid rgba(102, 112, 133, 0.18);
      }

      .profile:first-child {
        border-top: 0;
        padding-top: 0;
      }

      .dot {
        width: 10px;
        height: 10px;
        margin-top: 5px;
        border-radius: 999px;
      }

      .profile-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-weight: 740;
      }

      .tag {
        border-radius: 999px;
        padding: 2px 7px;
        background: rgba(23, 107, 91, 0.12);
        color: #176b5b;
        font-size: 11px;
        white-space: nowrap;
      }

      @media (prefers-color-scheme: dark) {
        .tag {
        color: #7ee2cc;
        }
      }

      .meta-line {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 5px;
        font-size: 12px;
        line-height: 1.45;
      }

      .meta-pill {
        border-radius: 999px;
        padding: 2px 7px;
        background: rgba(102, 112, 133, 0.11);
        color: #475467;
      }

      .validity {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        border: 1px solid #a5ddcf;
        border-radius: 7px;
        padding: 7px 9px;
        background: #e8f7f1;
        color: #176b5b;
        font-size: 12px;
      }

      .validity.expired {
        border-color: #f0c2c2;
        background: #fff1f1;
        color: #bd3b3b;
      }

      .calendar-icon {
        width: 14px;
        height: 14px;
        border: 2px solid currentColor;
        border-radius: 3px;
        position: relative;
        box-sizing: border-box;
      }

      .calendar-icon::before {
        content: "";
        position: absolute;
        left: 2px;
        right: 2px;
        top: 3px;
        border-top: 2px solid currentColor;
      }

      .validity strong {
        font-weight: 760;
      }

      .validity-date {
        color: #526173;
        font-variant-numeric: tabular-nums;
      }

      @media (prefers-color-scheme: dark) {
        .meta-pill {
          color: #c7ceda;
          background: rgba(255, 255, 255, 0.08);
        }

        .validity {
          border-color: rgba(126, 226, 204, 0.35);
          background: rgba(23, 107, 91, 0.24);
          color: #7ee2cc;
        }

        .validity.expired {
          border-color: rgba(255, 146, 146, 0.35);
          background: rgba(189, 59, 59, 0.2);
          color: #ffb0b0;
        }

        .validity-date {
          color: #b5bdca;
        }
      }

      .profile-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        margin-top: 8px;
      }

      .section-title,
      .empty-title {
        font-weight: 760;
        margin-bottom: 10px;
      }

      .profile-list {
        display: grid;
        gap: 10px;
      }

      .profile-card {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(102, 112, 133, 0.22);
        border-radius: 8px;
        padding: 12px;
        background: rgba(255, 255, 255, 0.72);
      }

      .profile-card.current {
        border-color: rgba(23, 107, 91, 0.42);
        box-shadow: 0 0 0 1px rgba(23, 107, 91, 0.1);
      }

      .color-bar {
        position: absolute;
        inset: 0 auto 0 0;
        width: 4px;
        background: var(--profile-color, #176b5b);
      }

      .corner-tags {
        position: absolute;
        top: 10px;
        right: 10px;
        display: flex;
        max-width: 132px;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 4px;
      }

      .corner-tag,
      .current-tag {
        max-width: 96px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        border-radius: 999px;
        padding: 2px 7px;
        background: rgba(23, 107, 91, 0.12);
        color: #176b5b;
        font-size: 11px;
        font-weight: 720;
      }

      .current-tag {
        background: rgba(37, 99, 235, 0.12);
        color: #2563eb;
      }

      .profile-card .profile-title {
        display: block;
        max-width: 220px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        padding-right: 104px;
        font-size: 14px;
        font-weight: 760;
      }

      .profile-meta,
      .detected-grid,
      .time-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
        color: #5b6575;
        font-size: 12px;
        line-height: 1.45;
      }

      .plan-badge {
        border-radius: 999px;
        padding: 2px 7px;
        background: rgba(23, 107, 91, 0.12);
        color: #176b5b;
        font-size: 11px;
        font-weight: 760;
      }

      .time-row {
        justify-content: space-between;
        color: #667085;
      }

      .detected-card {
        display: grid;
        gap: 4px;
        margin-bottom: 10px;
        border: 1px solid rgba(23, 107, 91, 0.22);
        border-radius: 8px;
        padding: 10px;
        background: rgba(23, 107, 91, 0.06);
      }

      .detected-card.pending {
        border-color: rgba(37, 99, 235, 0.22);
        background: rgba(37, 99, 235, 0.06);
      }

      .detected-card.warning {
        border-color: rgba(194, 65, 12, 0.28);
        background: rgba(194, 65, 12, 0.07);
      }

      .saved-current .detected-card {
        margin-bottom: 8px;
      }

      .detected-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 760;
      }

      .validity {
        display: grid;
        grid-template-columns: 1fr;
        gap: 7px;
      }

      .validity-line {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }

      .validity-line span {
        color: #526173;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .validity-track {
        overflow: hidden;
        height: 5px;
        border-radius: 999px;
        background: rgba(23, 107, 91, 0.16);
      }

      .validity-track span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: currentColor;
      }

      .validity.unknown .validity-track span {
        opacity: 0.45;
      }

      .tools {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }

      @media (prefers-color-scheme: dark) {
        .profile-card {
          background: rgba(255, 255, 255, 0.05);
        }

        .corner-tag,
        .plan-badge {
          color: #7ee2cc;
        }

        .current-tag {
          color: #9db7ff;
        }

        .profile-meta,
        .detected-grid,
        .time-row {
          color: #a5adbb;
        }

        .validity-line span {
          color: #b5bdca;
        }
      }

      .message {
        min-height: 18px;
        color: #176b5b;
        font-size: 12px;
        line-height: 1.45;
      }

      .message.error {
        color: #bd3b3b;
      }

      .empty {
        padding: 22px 8px;
        text-align: center;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app" class="app"></div>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
