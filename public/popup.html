<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPT Switch</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f7f8fb;
        color: #1e2532;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #10131a;
          color: #edf0f5;
        }
      }

      body {
        width: 360px;
        min-height: 420px;
        margin: 0;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .app {
        padding: 16px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .title {
        margin: 0;
        font-size: 17px;
        font-weight: 760;
      }

      .subtle {
        color: #667085;
        font-size: 12px;
        line-height: 1.45;
      }

      @media (prefers-color-scheme: dark) {
        .subtle {
          color: #a5adbb;
        }
      }

      .panel {
        display: grid;
        gap: 10px;
      }

      .box {
        border: 1px solid rgba(102, 112, 133, 0.22);
        border-radius: 8px;
        padding: 12px;
        background: rgba(255, 255, 255, 0.72);
      }

      @media (prefers-color-scheme: dark) {
        .box {
          background: rgba(255, 255, 255, 0.05);
        }
      }

      .field {
        display: grid;
        gap: 5px;
        margin-bottom: 9px;
      }

      .field label {
        font-size: 12px;
        color: #596273;
      }

      @media (prefers-color-scheme: dark) {
        .field label {
          color: #b5bdca;
        }
      }

      .input,
      .select {
        box-sizing: border-box;
        width: 100%;
        min-height: 36px;
        border: 1px solid rgba(102, 112, 133, 0.32);
        border-radius: 6px;
        padding: 7px 9px;
        background: rgba(255, 255, 255, 0.9);
        color: inherit;
      }

      @media (prefers-color-scheme: dark) {
        .input,
        .select {
          background: rgba(255, 255, 255, 0.07);
        }
      }

      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .row > * {
        flex: 1;
      }

      .btn {
        min-height: 36px;
        border-radius: 6px;
        padding: 7px 10px;
        color: #fff;
        background: #176b5b;
        font-weight: 680;
      }

      .btn.secondary {
        color: #263041;
        background: #e8ecf3;
      }

      .btn.danger {
        background: #bd3b3b;
      }

      .btn.ghost {
        color: inherit;
        background: transparent;
        border: 1px solid rgba(102, 112, 133, 0.28);
      }

      @media (prefers-color-scheme: dark) {
        .btn.secondary {
          color: #e9edf4;
          background: rgba(255, 255, 255, 0.11);
        }
      }

      .profile {
        display: grid;
        grid-template-columns: 12px 1fr;
        gap: 10px;
        padding: 10px 0;
        border-top: 1px solid rgba(102, 112, 133, 0.18);
      }

      .profile:first-child {
        border-top: 0;
        padding-top: 0;
      }

      .dot {
        width: 10px;
        height: 10px;
        margin-top: 5px;
        border-radius: 999px;
      }

      .profile-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-weight: 740;
      }

      .tag {
        border-radius: 999px;
        padding: 2px 7px;
        background: rgba(23, 107, 91, 0.12);
        color: #176b5b;
        font-size: 11px;
        white-space: nowrap;
      }

      @media (prefers-color-scheme: dark) {
        .tag {
          color: #7ee2cc;
        }
      }

      .profile-actions {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
        margin-top: 8px;
      }

      .message {
        min-height: 18px;
        color: #176b5b;
        font-size: 12px;
        line-height: 1.45;
      }

      .message.error {
        color: #bd3b3b;
      }

      .empty {
        padding: 22px 8px;
        text-align: center;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app" class="app"></div>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
